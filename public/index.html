<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ed">
  <title>PRIGEL AI</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/chat.js" defer></script>
</head>
<body class="student-page">
  <header class="masthead student-masthead frame">
    <a class="wordmark" href="/">PRIGEL AI</a>
  </header>

  <main id="chat" class="chat frame">
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Confused?<br><em>Ask here first.</em></h1>
      <p>Answers are based on the latest rector’s regulations and information presented at the PRIGEL briefing.</p>
    </section>

    <div id="conversation" class="conversation" hidden>
      <div id="messages" role="log" aria-label="Chat history" aria-relevant="additions"></div>
    </div>

    <div class="composer-wrap">
      <form id="composer" class="composer">
        <label class="visually-hidden" for="question">Question about the PRIGEL internship</label>
        <textarea id="question" name="question" rows="1" maxlength="4000" required></textarea>
        <button class="primary-button send-button" id="send" type="submit" aria-label="Send"><span aria-hidden="true">↑</span></button>
      </form>
      <p id="chat-error" class="error" role="alert" hidden></p>
    </div>

  </main>

  <footer class="site-footer student-footer frame">
    <p>Refreshing the tab clears this chat.</p>
    <p class="site-credit">Made by <a href="https://datachampions.tech" target="_blank" rel="noopener noreferrer">Data Champion Society</a></p>
  </footer>
</body>
</html>
